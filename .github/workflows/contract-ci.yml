name: Contract and application checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bonefree
          POSTGRES_PASSWORD: bonefree
          POSTGRES_DB: bonefree_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bonefree -d bonefree_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      AUTO_APPLY_MIGRATIONS: "false"
      DATABASE_URL: sqlite://
      TEST_POSTGRES_DATABASE_URL: postgresql+psycopg2://bonefree:bonefree@localhost:5432/bonefree_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate and verify the OpenAPI client
        working-directory: frontend
        run: |
          npm run api:generate
          git diff --exit-code -- openapi/openapi.json src/api/generated

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
